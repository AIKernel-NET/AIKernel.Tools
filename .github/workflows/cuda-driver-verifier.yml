name: cuda-driver-verifier
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test managed verifier and native failure paths
        shell: bash
        run: |
          dotnet test tests/AIKernel.Tools.Tests/AIKernel.Tools.Tests.csproj -c Release
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S tests/native/cuda-driver -B artifacts/cuda-verifier -A x64
          else
            cmake -S tests/native/cuda-driver -B artifacts/cuda-verifier -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build artifacts/cuda-verifier --config Release
          python tests/native/cuda-driver/verify.py src/AIKernel.CLI/bin/Release/net10.0/aik.dll artifacts/cuda-verifier
